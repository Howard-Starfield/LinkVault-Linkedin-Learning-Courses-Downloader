<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">LinkVault</title>
  <desc id="desc">A transparent app icon with a blue learning book, graduation cap, and download badge.</desc>
  <defs>
    <linearGradient id="book-face" x1="58" y1="33" x2="197" y2="202" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#35a8ff"/>
      <stop offset=".55" stop-color="#146cff"/>
      <stop offset="1" stop-color="#0d3ed3"/>
    </linearGradient>
    <linearGradient id="book-spine" x1="36" y1="46" x2="80" y2="205" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0c5ee8"/>
