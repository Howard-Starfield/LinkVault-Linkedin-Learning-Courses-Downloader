    <path d="M103 31.5 148 12l47 19.5-47 18.8Z" fill="#161b28" stroke="#a7bed8" stroke-width="2"/>
    <path d="M113 31.7 148 17l36.7 14.7L148 45.7Z" fill="#263241"/>
    <path d="M186.8 33.1v18.5" fill="none" stroke="#93a8bd" stroke-width="2.3" stroke-linecap="round"/>
    <circle cx="186.8" cy="55.6" r="3.2" fill="#33a3ff"/>
    <path d="M136.5 34h21v31h16L147.3 91 121 65h15.5Z" fill="url(#arrow)" stroke="#e8ffd8" stroke-width="2.4" stroke-linejoin="round"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="800" letter-spacing="0">
