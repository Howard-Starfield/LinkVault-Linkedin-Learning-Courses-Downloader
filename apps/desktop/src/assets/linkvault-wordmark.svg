<svg xmlns="http://www.w3.org/2000/svg" width="470" height="95" viewBox="0 10 470 95" role="img" aria-labelledby="title desc">
  <title id="title">LinkVault Course Downloader</title>
  <desc id="desc">Transparent LinkVault Course Downloader wordmark.</desc>
  <defs>
    <linearGradient id="linkedin-box" x1="14" y1="14" x2="108" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1697e8"/>
      <stop offset="1" stop-color="#075aa6"/>
    </linearGradient>
    <linearGradient id="book-cover" x1="101" y1="64" x2="198" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#246ac4"/>
      <stop offset="1" stop-color="#123f8f"/>
    </linearGradient>
    <linearGradient id="arrow" x1="147" y1="30" x2="147" y2="83" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9ee954"/>
      <stop offset="1" stop-color="#35a525"/>
    </linearGradient>
    <linearGradient id="course-text" x1="211" y1="18" x2="361" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d79d3"/>
      <stop offset="1" stop-color="#0a4ea7"/>
    </linearGradient>
    <linearGradient id="download-text" x1="211" y1="66" x2="450" y2="97" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#80d13f"/>
      <stop offset="1" stop-color="#46aa2b"/>
    </linearGradient>
    <filter id="soft-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity=".35"/>
    </filter>
  </defs>

  <g filter="url(#soft-shadow)">
    <rect x="12" y="17" width="91" height="79" rx="10" fill="url(#linkedin-box)"/>
    <rect x="17" y="22" width="81" height="69" rx="6" fill="none" stroke="#55bbff" stroke-width="2" opacity=".85"/>
    <circle cx="35" cy="38" r="7.5" fill="#071019"/>
    <rect x="28" y="50" width="14" height="35" rx="2" fill="#071019"/>
    <path d="M50 50h13v5.2c3.7-4.2 8.6-6.3 14.6-6.3 10.4 0 17.4 7 17.4 20.7V85H81V71.2c0-6.7-2.7-9.9-7.8-9.9-5.3 0-9.2 3.8-9.2 11V85H50Z" fill="#071019"/>
  </g>

  <g filter="url(#soft-shadow)">
    <path d="M104 78.5c26.3-8 61.5-8 88 0v19.8c-26.5-7.9-61.7-7.9-88 0Z" fill="#f7fbff"/>
    <path d="M104 81.3c26.3-8 61.5-8 88 0v22c-26.7 8.2-61.4 8.2-88 0Z" fill="url(#book-cover)"/>
    <path d="M113 79.5c20.8-4.9 48.8-4.9 70 0v7.8c-22.9-4.7-47.2-4.7-70 0Z" fill="#f2fff4"/>
