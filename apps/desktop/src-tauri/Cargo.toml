[package]
name = "linkvault"
version = "0.1.8"
description = "LinkVault desktop app"
authors = ["LinkVault"]
license-file = "../../../LICENSE"
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "linkvault"

[lib]
name = "linkvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "linkvault"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
bytes = "1"
mime = "0.3"
regex = "1"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
url = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-updater = "2"

[dev-dependencies]
wiremock = "0.6"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
panic = "abort"
strip = true
