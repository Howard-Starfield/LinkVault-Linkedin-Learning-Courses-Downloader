name: YouTube V1 Internal Hardening

on:
  push:
    branches:
      - spec/youtube-downloader-v1
    paths:
      - ".github/workflows/youtube-v1-internal-hardening.yml"
      - "apps/desktop/**"
      - "docs/work-orders/youtube-downloader-v1-handoff.md"
      - "docs/third-party/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youtube-v1-internal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-internal-gates:
    name: Windows internal source and fixture gates
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout authorized branch commit
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install frontend dependencies
        run: npm ci --prefix apps/desktop

      - name: Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

      - name: Rust library check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --lib

      - name: Rust library tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib -- --test-threads=1

      - name: Windows managed-process hostile fixture tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --features youtube-process-test --test youtube_managed_process_windows -- --test-threads=1

      - name: Architecture gate
        run: npm --prefix apps/desktop run verify:architecture

      - name: Repository UI gate
        run: npm --prefix apps/desktop run verify:ui

      - name: YouTube UI contract gate
        run: npm --prefix apps/desktop run verify:youtube-ui

      - name: No explicit TypeScript any gate
        run: npm --prefix apps/desktop run verify:no-any

      - name: Frontend production build
        run: npm --prefix apps/desktop run build

      - name: Confirm helper lock remains fail-closed
        shell: pwsh
        run: |
          $global:PSNativeCommandUseErrorActionPreference = $false
          npm --prefix apps/desktop run verify:youtube-helpers
          $verificationExitCode = $LASTEXITCODE
          if ($verificationExitCode -eq 0) {
            throw "The unpopulated YouTube helper lock unexpectedly passed verification."
          }
          Write-Host "Helper verification failed closed as required while the authoritative lock is unavailable."
          exit 0
