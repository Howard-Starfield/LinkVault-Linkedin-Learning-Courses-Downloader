name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm --dir apps/desktop install --frozen-lockfile

      - name: Build LinkVault installer
        run: pnpm --dir apps/desktop tauri build

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: LinkVault ${{ github.ref_name }}
          generate_release_notes: true
          files: apps/desktop/src-tauri/target/release/bundle/nsis/LinkVault_*_x64-setup.exe
